<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HandDuel – Rock Paper Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- Fullscreen webcam — camera-as-hero background -->
    <video id="webcam-p1" autoplay muted playsinline></video>

    <!-- Landmark overlay — MediaPipe skeleton drawn here -->
    <canvas id="landmark-canvas"></canvas>

    <!-- Three.js scene — transparent bg, gesture meshes + particles -->
    <canvas id="game-canvas"></canvas>

    <!-- Hidden remote video (online PvP only) -->
    <video id="webcam-p2" autoplay muted playsinline></video>

    <!-- UI Overlay -->
    <div id="ui-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
