name: ci

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Typecheck frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build frontend (Vite)
        run: npm run build -w frontend
        env:
          VITE_SERVER_URL: https://handduel-revamp.vercel.app
